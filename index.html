<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-container">
    <h1>Tic Tac Toe</h1>

    <div class="controls">
      <input type="text" id="player1-name" placeholder="Player 1 (X)" value="Player 1">
      <input type="text" id="player2-name" placeholder="Player 2 (O)" value="Player 2">
      <button id="restart-btn">Start / Restart Game</button>
    </div>

    <div id="status-display" class="status-display">Player 1's turn (X)</div>

    <div id="gameboard" class="gameboard"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
